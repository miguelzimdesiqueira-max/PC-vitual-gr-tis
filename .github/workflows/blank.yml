name: Windows Virtual

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Ver informações do PC
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS VIRTUAL ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "`n=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "`n=== RAM ==="
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("RAM: {0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB))

      - name: Atualizar ferramentas
        shell: pwsh
        run: |
          winget --version

      - name: Instalar 7-Zip
        shell: pwsh
        run: |
          winget install --id 7zip.7zip `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Testar armazenamentoname
        shell: pwsh
        run: |
          Get-PSDrive C |
            Select-Object Name,
              @{N="UsedGB";E={[math]::Round($_.Used/1GB,2)}},
              @{N="FreeGB";E={[math]::Round($_.Free/1GB,2)}}

      - name: Finalizar
        run: |
          echo "Windows virtual configurado!"
          echo "O runner será encerrado ao terminar o workflow."
